# Databricks Asset Bundle (sketch, not deployed: no workspace was used for this project).
# The notebooks in this folder call the same functions as run.py; paths point to Unity Catalog volumes.
bundle:
  name: medallion-lakehouse-lab

resources:
  jobs:
    daily_medallion:
      name: daily_medallion
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: Europe/Zurich
      parameters:
        - name: day
          default: "{{job.start_time.iso_date}}"
      tasks:
        - task_key: bronze
          notebook_task: {notebook_path: ./01_bronze.py}
        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task: {notebook_path: ./02_silver.py}
        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task: {notebook_path: ./03_gold.py}

targets:
  dev:
    mode: development
    default: true
